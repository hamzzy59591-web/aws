spring.application.name=boot_khj

# DB 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/community?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USER_NAME:root}
spring.datasource.password=${DB_USER_PASSWORD:root}

# JPA 설정
spring.jpa.hibernate.ddl-auto=none 
#엔티티 클래스의 변경사항을 감지하여 db 테이블을 자동으로 업데이트
spring.jpa.show-sql=true 
# SQL 콘솔에 출력
spring.jpa.properties.hibernate.format_sql=true
# 콘솔에 출력되는 SQL문을 정렬
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JPA 사용할 DBMS 종류를 지정

# 32자 이상의 임의 문자열 설정
jwt.secret: your-super-secret-key-that-is-at-least-32-bytes-long
# 1시간 (밀리초)
# jwt.expiration: 3600000 
jwt.access-token-in-ms = 3600000
# 7일 = 1000(밀리초) * 60(초) * 60(분) * 24(시간) * 7(일)
jwt.refresh-token-in-ms = 604800000

file.path=${FILE_PATH:C:/Users/admin/Documents/uploads/}