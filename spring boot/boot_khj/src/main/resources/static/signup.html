<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>회원 가입</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/Layout.js"></script>
</head>

<body>
	<app-header></app-header>
	<div class="container">
		<h1>회원가입</h1>
		
		<form id="form">
			<div class="form-group mb-3" >
				<input class="form-control" type="text" name="id" id="id" placeholder="아이디를 입력하세요.">
			</div>
			<div class="form-group mb-3">
				<input class="form-control" type="password" name="pw" id="pw" placeholder="비번을 입력하세요." >
			</div>
			<div class="form-group mb-3">
				<input class="form-control" type="password" name="pw2" id="pw2" placeholder="비번확인을 입력하세요.">
			</div>
			<div class="form-group mb-3">
				<input class="form-control" type="email" name="email" id="email" placeholder="이메일을 입력하세요.">
			</div>
			<button class="btn btn-outline-success col-12" type="submit">회원가입</button>
			<br>
		</form>
	
	</div>
	
	
	
	<script type="text/javascript">
	
	const formEl = document.querySelector("#form");
	const idEl = document.querySelector("#id");
	const pwEl = document.querySelector("#pw");
	const pw2El = document.querySelector("#pw2");
	const emailEl = document.querySelector("#email");
	
	formEl.addEventListener("submit", e=>{
    	e.preventDefault();
    	const id = idEl.value;
    	const pw = pwEl.value;
    	const pw2 = pw2El.value;
    	const email = emailEl.value;
    	
    	const queryString = `id=${id}&pw=${pw}&email=${email}`;
    	
    	//SignupUser(queryString);
    	
    	let user ={
    			id,//왼쪽은 id 속성명, 오른쪽은 id 변수
    			pw,
    			email
    	}
    	console.log(user);
    	//FormData 객체를 이용하여 form태그 안에 있는 입력 태그들의 값들을 객체로 변환
    	const formData = new FormData(formEl);
    	const data = Object.fromEntries(formData.entries());
    	//console.log(data);
    	sendDataPost(data);
 	});
	
	//get 방식으로 회원 정보를 전송하는 함수 실제로 이러면 안됨
	async function SignupUser(queryString){
		try{
			const response = await fetch("/user/Signup?"+queryString);
			
			if(!response.ok){
				throw new Error("회원 가입 실패");
				
			}
			const result = await response.text();
			console.log(result);
		}catch(e){
			console.error("에러발생 : n",e)
			alert(e);
		}
	}
	//회원 정보를 post 방식으로 전송
	async function sendDataPost(data){
		try{
			const response = await fetch("/user/signup",{
				method : "post",
				headers : {
					"Content-Type" : "application/json" //header에 실어 보낼 데이터 종류가  json
				},
				body: JSON.stringify(data) // 보낼 데이터
			});
			
			const result = await response.text();
			console.log(result);
		}catch(e){
			console.error("에러발생 : n",e)
			alert(e);
		}
	}

	
	</script>
</body>
</html>
