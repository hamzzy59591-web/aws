<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	
	</header>
	<h1>회원가입</h1>
	<form id="form">
	<input type="text" name="id" id="id" placeholder="아이디를 입력하세요." required><br>
	<input type="password" name="pw" id="pw" placeholder="비번을 입력하세요." required><br>
	<input type="password" name="pw2" id="pw2" placeholder="비번확인을 입력하세요."><br>
	<input type="email" name="email" id="email" placeholder="이메일을 입력하세요."><br>
	<button type="submit">회원가입</button>
	<br>
	</form>
	<a href="/">메인 페이지로 이동</a>
	
	<script type="text/javascript">
	
	const formEl = document.querySelector("#form");
	const idEl = document.querySelector("#id");
	const pwEl = document.querySelector("#pw");
	const pw2El = document.querySelector("#pw2");
	const emailEl = document.querySelector("#email");
	
	formEl.addEventListener("submit", e=>{
    	e.preventDefault();
    	const id = idEl.value;
    	const pw = pwEl.value;
    	const pw2 = pw2El.value;
    	const email = emailEl.value;
    	
    	const queryString = `id=${id}&pw=${pw}&email=${email}`;
    	
    	SignupUser(queryString);
 	});
	
	async function SignupUser(queryString){
		try{
			const response = await fetch("/user/Signup?"+queryString);
			
			if(!response.ok){
				throw new Error("회원 가입 실패");
				
			}
			const result = await response.text();
			console.log(result);
		}catch(e){
			console.error("에러발생 : n"+ e)
		}
	}
	
	</script>
</body>
</html>
