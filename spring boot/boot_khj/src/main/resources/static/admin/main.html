<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>부트:관리자</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/Layout.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1> 관리자 페이지 </h1>
		<form class="input-group mb-3" id="boardForm">
  			<input type="text" name="board" class="form-control" placeholder="게시판을 입력하세요.">
  			<button class="btn btn-success" type="submit">등록</button>
		</form>
	</div>
	
	<script>
		//form태그를 submit하면 서버로 전송하는 기능을 막고, alert(1)이 실행되도록 작성
		//1. form태그 요소 선택
		const formEl = document.querySelector("#boardForm");
		//2. form태그 요소에 submit 이벤트를 등록
		formEl.addEventListener("submit", e=>{
			//3. form태그의 기본 기능을 막음
			e.preventDefault();
			//input 태그의 입력된 값을 가져와서 객체로 만듬
			const formData = new FormData(formEl);
	    	const data = Object.fromEntries(formData.entries());
	    	//서버로 data를 post방식으로 전송
	    	//url : /api/admin/board
	    	submitBoard(data);
	    	
		});
		
		async function submitBoard(data){
			try{
				const response = await fetch("/api/admin/board",{
					method : "POST", // 전송 방식 : GET,POST,PUT, DELETE, PATCH
					headers : {
						"Content-Type" : "application/json" 
					},
					body: JSON.stringify(data)
				});
				
				if(!response.ok){
					console.log("정상 종료 아님");
					return;
				}
				const result = await response.text();
				alert(result);
			}catch(e){
				console.log("에러발생 : n",e)
			}
		}	
		
	</script>
</body>
</html>
