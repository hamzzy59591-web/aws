<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>회원 가입</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/Layout.js"></script>
	<script src="/js/signup.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<br><h1>회원가입</h1>
		
		<form id="form" onsubmit="signup(event)">
			<div class="form-group mb-3" >
				<input class="form-control" type="text" name="id" id="id" placeholder="아이디를 입력하세요." oninput="changeInput(event)">
			</div>
			<div class="form-group mb-3">
				<input class="form-control" type="password" name="pw" id="pw" placeholder="비번을 입력하세요." oninput="changeInput(event)">
			</div>
			<div class="form-group mb-3">
				<input class="form-control" type="password" name="pw2" id="pw2" placeholder="비번확인을 입력하세요." oninput="changeInput(event)">
			</div>
			<div class="form-group mb-3">
				<input class="form-control" type="email" name="email" id="email" placeholder="이메일을 입력하세요." oninput="changeInput(event)">
			</div>
			<button class="btn btn-outline-success col-12" type="submit">회원가입</button>
			<br>
		</form>
	</div>
	
	<script>
	
	
	</script>
	
</body>
</html>
