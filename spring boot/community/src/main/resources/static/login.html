<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>커뮤니티 : 로그인</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/auth.js"></script>
	<script src="/js/Layout.js"></script>
	<script src="/js/login.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<br><h1>로그인</h1>
		
		<form id="form" onsubmit="login(event)">
			<div class="form-group mb-3" >
				<input class="form-control" type="text" name="id" placeholder="아이디를 입력하세요." oninput="changeInput(event)">
			</div>
			<div class="form-group mb-3">
				<input class="form-control" type="password" name="pw" placeholder="비번을 입력하세요." oninput="changeInput(event)">
			</div>
			<button class="btn btn-outline-success col-12" type="submit">로그인</button>
			<br>
		</form>
	</div>
</body>
</html>
