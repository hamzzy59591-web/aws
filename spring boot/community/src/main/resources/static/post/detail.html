<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> 커뮤니티: 게시글 </title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/auth.js"></script>
	<script src="/js/Layout.js"></script>
	<script src="/js/post/detail.js"></script>
	
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<br><h1> 게시글 상세 </h1><br>
		
		<!-- 제목, 내용, 첨부파일(지금은 생략), 작성자(로그인 기능 구현 후 제거) -->
		<div class="form-group mb-3">
			<label class="form-label">제목</label>
			<input type="text" class="form-control" readonly name="title">			
		</div>
		<label class="form-label">작성자</label>
		<div class="form-group mb-3">
			<input type="text" class="form-control" readonly name="writer">			
		</div>
		<label class="form-label">게시판</label>
		<div class="form-group mb-3">
			<input type="text" class="form-control" readonly name="boardName">			
		</div>
		<label class="form-label">조회수</label>
		<div class="form-group mb-3">
			<input type="text" class="form-control" readonly name="view">			
		</div>
		<label class="form-label">작성일</label>
		<div class="form-group mb-3">
			<input type="text" class="form-control" readonly name="createdAt">			
		</div>
		<div class="mb-3 d-flex justify-content-center">
			 <button class="btn btn-outline-success me-3">좋아요(<span class="up-count">0</span>)</button>
			 <button class="btn btn-outline-success">싫어요(<span class="down-count">0</span>)</button>
		</div>
		<label class="form-label">내용</label>
		<div class="form-group mb-3">
			<textarea class="form-control" rows="10" readonly name="content"></textarea>		
		</div>
		<div class="btns">
			<button class="btn btn-outline-danger btn-delete">삭제</button>
			<button class="btn btn-outline-warning btn-update">수정</button>
		</div>
	</div>
	
</body>
</html>
