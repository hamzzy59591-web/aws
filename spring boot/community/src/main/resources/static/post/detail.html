<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> 커뮤니티: 게시글 </title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/auth.js"></script>
	<script src="/js/Layout.js"></script>
	<script src="/js/post/detail.js"></script>
	
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<br><h1> 게시글 상세 </h1><br>
		
		<!-- 제목, 내용, 첨부파일(지금은 생략), 작성자(로그인 기능 구현 후 제거) -->
		<div class="form-group mb-3">
			<label class="form-label">제목</label>
			<input type="text" class="form-control" readonly name="title">			
		</div>
		<label class="form-label">작성자</label>
		<div class="form-group mb-3">
			<input type="text" class="form-control" readonly name="writer">			
		</div>
		<label class="form-label">게시판</label>
		<div class="form-group mb-3">
			<input type="text" class="form-control" readonly name="boardName">			
		</div>
		<label class="form-label">조회수</label>
		<div class="form-group mb-3">
			<input type="text" class="form-control" readonly name="view">			
		</div>
		<label class="form-label">작성일</label>
		<div class="form-group mb-3">
			<input type="text" class="form-control" readonly name="createdAt">			
		</div>
		<div class="mb-3 d-flex justify-content-center">
			 <button class="btn btn-outline-success me-3" onclick="clickLike(1)">좋아요(<span class="up-count">0</span>)</button>
			 <button class="btn btn-outline-success" onclick="clickLike(-1)">싫어요(<span class="down-count">0</span>)</button>
		</div>
		<label class="form-label">내용</label>
		<div class="form-group mb-3">
			<textarea class="form-control" rows="10" readonly name="content"></textarea>		
		</div>
		<div class="form-group mb-3">
			<label>첨부파일</label>
			<div id="files">
			<a class="form-control" href="#">첨부파일</a>
			</div>
		</div>
		<div class="btns">
			<button class="btn btn-outline-danger btn-delete">삭제</button>
			<button class="btn btn-outline-warning btn-update">수정</button>
		</div>
		
		<hr>
		<h1>댓글 목록</h1>
		<ul id="comment-list">
			<div class="card mb-3 card-body">
				<div class="card-body">
					<div class="d-flex justify-content-between">
				    	<strong>김하니</strong>
				        <small class="text-secondary">2026-09-02</small>
				    </div>
				    <p class="mt-3 mb-0">안녕하세요</p>
				 </div>
			</div>
		</ul>
		<nav aria-label="댓글 페이지">
			<ul id="comment-pagination" class="pagination justify-content-center">
			</ul>
		</nav>
		<div id="comment-box">
		<form class="input-group mb-5" onsubmit="createComment1(event)">
			<textarea class="form-control" name="content"></textarea>
			<button class="btn btn-success">등록</button>
		</form>
		<!--  
		댓글을 입력해서 등록 버튼을 클릭하면 비동기 방식으로 서버에 댓글 정보를 전송
		-->
		</div>
	</div>
	
</body>
</html>
