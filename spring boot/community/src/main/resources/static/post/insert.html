<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> 커뮤니티 : 게시글 </title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/auth.js"></script>
	<script src="/js/Layout.js"></script>
	<script src="/js/post/insert.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<br><h1> 게시글 등록 </h1><br>
		<form id="insertForm" onsubmit="insertPost(event)">
			<!-- 제목, 내용, 첨부파일(지금은 생략), 작성자(로그인 기능 구현 후 제거) -->
			<div class="form-group mb-3">
				<input type="text" class="form-control" name="title" placeholder="제목" oninput="changeinput(event)">			
			</div>
			<div class="form-group mb-3">
				<select class="form-control board-list" name="boardId" oninput="changeinput(event)">
					<option value="10">게시판을 선택하세요.</option>
				</select>
			</div>
			<div class="form-group mb-3">
				<textarea class="form-control" rows="10" name="content" placeholder="내용" oninput="changeinput(event)"></textarea>		
			</div>
			<button class="btn btn-outline-success col-12">게시글 등록</button>
		</form>
	</div>
	
</body>
</html>
